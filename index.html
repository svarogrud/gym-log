<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Log</title>
<meta name="description" content="Журнал тренувань: дні, підходи, ваги, таймер відпочинку, резервна копія в Google Sheets.">
<meta name="theme-color" content="#E8EAEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111416" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" hidden aria-label="Розділи">
  <button data-t="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg><span>Тренування</span></button>
  <button data-t="exlist"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12h8M3 9h3v6H3zM18 9h3v6h-3zM6 7h2v10H6zM16 7h2v10h-2z"/></svg><span>Вправи</span></button>
  <button data-t="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5zM9 8h6M9 12h6M9 16h4"/></svg><span>Програма</span></button>
  <button data-t="me"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-7 8-7s7 2.5 8 7"/></svg><span>Профіль</span></button>
</nav>
<div class="pk" id="picker" hidden></div>
<div class="rest" id="rest" hidden>
  <div class="rt num" id="restT">1:30</div>
  <div class="rl" id="restL">відпочинок</div>
  <button data-act="rm" aria-label="Мінус 15 секунд">−15</button>
  <button data-act="rp" aria-label="Плюс 15 секунд">+15</button>
  <button class="go" data-act="rs">Далі</button>
</div>
<script src="anim.js"></script>
<script src="exinfo.js"></script>
<script src="app.js"></script>
</body>
</html>
