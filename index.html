<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Log</title>
<meta name="description" content="Журнал тренувань: дні, підходи, ваги, таймер відпочинку, резервна копія в Google Sheets.">
<meta name="theme-color" content="#E8EAEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111416" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap" id="app"></div>
<div class="pk" id="picker" hidden></div>
<div class="rest" id="rest" hidden>
  <div class="rt num" id="restT">1:30</div>
  <div class="rl" id="restL">відпочинок</div>
  <button data-act="rm" aria-label="Мінус 15 секунд">−15</button>
  <button data-act="rp" aria-label="Плюс 15 секунд">+15</button>
  <button class="go" data-act="rs">Далі</button>
</div>
<script src="app.js"></script>
</body>
</html>
